<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UCR TV Studies · Batch 11</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0B0F17;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #111827;
      border: 1px solid #1E293B;
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(255, 121, 0, 0.25) 0%, rgba(255, 121, 0, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 121, 0, 0.15);
      border: 1px solid rgba(255, 121, 0, 0.35);
      color: #FF7900;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .badge .dot {
      width: 6px;
      height: 6px;
      background: #FF7900;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #FFFFFF;
    }
    p {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .spinner-box {
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3.5px solid rgba(255, 121, 0, 0.2);
      border-top-color: #FF7900;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .status-text {
      font-size: 12px;
      color: #CBD5E1;
      font-weight: 600;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background: #FF7900;
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(255, 121, 0, 0.35);
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .hidden {
      display: none !important;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div style="margin-bottom: 16px;">
      <img src="logo.png" alt="TV B11 Logo" style="width: 80px; height: 80px; border-radius: 20px; box-shadow: 0 10px 25px rgba(255, 121, 0, 0.35);">
    </div>
    <div class="badge">
      <span class="dot"></span>
      <span>TV B11 · Realtime Sync</span>
    </div>

    <h1>TV B11</h1>
    <p>Division of Television Studies · University College of Ratmalana</p>

    <div id="loadingSection" class="spinner-box">
      <div class="spinner"></div>
      <div class="status-text">Connecting to Live Portal...</div>
    </div>

    <div id="offlineSection" class="hidden">
      <p style="color: #F87171; font-weight: 600; margin-bottom: 20px;">
        Unable to connect to the live portal. Please check your internet connection.
      </p>
      <button class="btn" onclick="retryConnection()">Retry Connection</button>
    </div>
  </div>

  <script>
    const LIVE_URL = "https://tv-b11.onrender.com";

    function checkAndRedirect() {
      if (navigator.onLine) {
        document.getElementById('loadingSection').classList.remove('hidden');
        document.getElementById('offlineSection').classList.add('hidden');
        
        fetch(LIVE_URL + '/api/health', { method: 'HEAD', mode: 'no-cors' })
          .then(() => {
            window.location.replace(LIVE_URL);
          })
          .catch(() => {
            // Still attempt redirect after brief timeout
            setTimeout(() => {
              window.location.replace(LIVE_URL);
            }, 1000);
          });
      } else {
        document.getElementById('loadingSection').classList.add('hidden');
        document.getElementById('offlineSection').classList.remove('hidden');
      }
    }

    function retryConnection() {
      checkAndRedirect();
    }

    window.addEventListener('online', checkAndRedirect);
    window.addEventListener('load', checkAndRedirect);

    // Initial check
    setTimeout(checkAndRedirect, 400);
  </script>
</body>
</html>
